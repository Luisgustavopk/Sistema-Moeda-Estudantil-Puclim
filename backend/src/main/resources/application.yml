spring:
  application:
    name: puclim
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/puclim?connectionTimeZone=UTC}
    username: ${DB_USER:puclim}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
