spring:
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  application:
    name: puclim
  datasource:
    url: "${DB_URL:jdbc:${DB_ENGINE:mysql}://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:puclim}?connectionTimeZone=UTC}"
    username: ${DB_USER:puclim}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      accept-float-as-int: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
puclim:
  images:
    directory: ${UPLOAD_DIRECTORY:./storage/images}
  semester:
    zone: ${SEMESTER_ZONE:America/Sao_Paulo}
  mail:
    from: ${MAIL_FROM:puclim@localhost}
    retry-delay-ms: ${MAIL_RETRY_DELAY_MS:30000}
